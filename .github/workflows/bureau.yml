name: Installateur Windows

# À chaque étiquette de version (git tag v1.0.0 && git push --tags) : application autonome, auto-vérification,
# installateur, puis publication dans les « Releases » du dépôt. Le bouton « Télécharger » du site y pointe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.lock
      - name: Bibliothèques (versions figées)
        run: pip install -r application/requirements.lock pyinstaller
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Application et installateur
        run: python construire_bureau.py
      - name: Auto-vérification de l'application empaquetée
        shell: pwsh
        run: |
          $p = Start-Process dist\ChainesDeCotes\ChainesDeCotes.exe -ArgumentList '--verifier', "$pwd\verification.txt" -PassThru -Wait
          Get-Content verification.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Notes de version
        shell: pwsh
        run: |
          $v = (Select-String application/chainecotes/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $exe = Get-Item "dist/ChainesDeCotes_Installation_$v.exe"
          $mo = [math]::Round($exe.Length / 1MB)
          # nouveautés : la section de cette version dans CHANGELOG.md (du titre « ## x.y.z » au titre suivant)
          $journal = @(Get-Content CHANGELOG.md -Encoding utf8)
          $debut = ($journal | Select-String -Pattern "^## $([regex]::Escape($v))( |$)" | Select-Object -First 1).LineNumber
          $nouveautes = "Voir [CHANGELOG.md](https://github.com/theo33-oss/chaines-de-cotes-1D/blob/main/CHANGELOG.md)."
          if ($debut -and $debut -lt $journal.Length) {
            $suite = @($journal[$debut..($journal.Length - 1)])
            $fin = ($suite | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
            if ($fin -gt 1) { $suite = @($suite[0..($fin - 2)]) } elseif ($fin -eq 1) { $suite = @() }
            if (($suite -join "").Trim()) { $nouveautes = ($suite -join "`n").Trim() }
          }
          @"
          ## Chaînes de cotes 1D $v pour Windows

          ### Nouveautés

          $nouveautes

          ### Installer

          **Télécharger** : ``ChainesDeCotes_Installation_$v.exe`` ($mo Mo), ci-dessous dans « Assets ».

          1. Lancez le fichier. Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires*, puis *Exécuter quand même* (l'installateur n'est pas signé par un certificat payant).
          2. L'installation se fait pour vous seul, sans droits d'administrateur, et crée une icône sur le Bureau.
          3. L'application s'ouvre en quelques secondes et fonctionne sans Internet.

          Version dans le navigateur, sans installation : https://theo33-oss.github.io/chaines-de-cotes-1D/
          Ce que l'outil ne traite pas : [LIMITES.md](https://github.com/theo33-oss/chaines-de-cotes-1D/blob/main/LIMITES.md)
          "@ | Out-File -Encoding utf8 notes.md
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Chaînes de cotes 1D ${{ env.VERSION }}
          body_path: notes.md
          files: dist/ChainesDeCotes_Installation_${{ env.VERSION }}.exe
      - name: Installateur (essai sans étiquette)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installateur
          path: dist/ChainesDeCotes_Installation_*.exe
