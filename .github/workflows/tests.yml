name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calcul:
    name: Tests du calcul (sans fenêtre)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/requirements.lock
      - run: pip install -r requirements.lock pytest pytest-qt
      - run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_bouton_calculer_haut.py --ignore=tests/test_bureau.py --ignore=tests/test_bureau_comme_le_site.py --ignore=tests/test_comparer_repartition.py --ignore=tests/test_etude.py --ignore=tests/test_lot3.py --ignore=tests/test_procedes_atelier.py --ignore=tests/test_proposition_limites.py --ignore=tests/test_validation_verrou.py
